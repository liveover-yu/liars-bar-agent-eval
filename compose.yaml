services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: liars_eval
      POSTGRES_USER: liars_eval
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-dev-password}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U liars_eval -d liars_eval"]
      interval: 3s
      timeout: 3s
      retries: 20
  control-plane:
    build:
      context: .
      dockerfile: docker/control-plane.Dockerfile
    environment:
      SERVER_ADDRESS: 0.0.0.0
      SPRING_PROFILES_ACTIVE: postgres
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/liars_eval
      SPRING_DATASOURCE_USERNAME: liars_eval
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-local-dev-password}
      LIARS_CONTROL_API_KEY: ${LIARS_CONTROL_API_KEY:-local-dev-key-change-me}
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
  worker:
    build:
      context: .
      dockerfile: docker/worker.Dockerfile
    environment:
      LIARS_CONTROL_SERVER: http://control-plane:8080
      LIARS_CONTROL_API_KEY: ${LIARS_CONTROL_API_KEY:-local-dev-key-change-me}
      LIARS_API_BASE_URL: ${LIARS_API_BASE_URL:-https://api.openai.com/v1}
      LIARS_API_KEY: ${LIARS_API_KEY:-}
    depends_on:
      control-plane:
        condition: service_started

volumes:
  postgres-data:
