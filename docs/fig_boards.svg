<svg xmlns="http://www.w3.org/2000/svg" width="760" height="368" viewBox="0 0 760 368" role="img" aria-label="每个牌面的质疑率">
<rect width="760" height="368" fill="#fcfcfb"/>
<style>text{font-family:system-ui, -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;}</style>
<text x="24.0" y="28.0" font-size="15" fill="#0b0b0b" text-anchor="start" font-weight="600">每个牌面的质疑率（自己 0 枪、对手 0 枪）</text>
<text x="24.0" y="46.0" font-size="11" fill="#898781" text-anchor="start" font-weight="400">左侧是质疑者手牌与对方宣称；右侧数字是「被迫诈唬下界」，即他能算出的最低诈唬概率</text>
<line x1="232.0" y1="48" x2="232.0" y2="324" stroke="#e1e0d9" stroke-width="1"/>
<text x="232.0" y="340.0" font-size="10" fill="#898781" text-anchor="middle" font-weight="400">0%</text>
<line x1="340.0" y1="48" x2="340.0" y2="324" stroke="#e1e0d9" stroke-width="1"/>
<text x="340.0" y="340.0" font-size="10" fill="#898781" text-anchor="middle" font-weight="400">25%</text>
<line x1="448.0" y1="48" x2="448.0" y2="324" stroke="#e1e0d9" stroke-width="1"/>
<text x="448.0" y="340.0" font-size="10" fill="#898781" text-anchor="middle" font-weight="400">50%</text>
<line x1="556.0" y1="48" x2="556.0" y2="324" stroke="#e1e0d9" stroke-width="1"/>
<text x="556.0" y="340.0" font-size="10" fill="#898781" text-anchor="middle" font-weight="400">75%</text>
<line x1="664.0" y1="48" x2="664.0" y2="324" stroke="#e1e0d9" stroke-width="1"/>
<text x="664.0" y="340.0" font-size="10" fill="#898781" text-anchor="middle" font-weight="400">100%</text>
<line x1="232" y1="48" x2="232" y2="324" stroke="#c3c2b7" stroke-width="1"/>
<text x="220.0" y="74.0" font-size="11" fill="#52514e" text-anchor="end" font-weight="400">K, A, K, Joker, A → 1×Q</text>
<text x="238.0" y="74.0" font-size="11" fill="#0b0b0b" text-anchor="start" font-weight="600">0%</text>
<text x="740.0" y="74.0" font-size="11" fill="#898781" text-anchor="end" font-weight="400">下界 0.019</text>
<text x="220.0" y="108.0" font-size="11" fill="#52514e" text-anchor="end" font-weight="400">A, A, A, A, A → 2×Q</text>
<path d="M232.0,96.0 h82.4 a4,4 0 0 1 4,4 v12.0 a4,4 0 0 1 -4,4 h-82.4 z" fill="#c3c2b7"/>
<text x="326.4" y="108.0" font-size="11" fill="#0b0b0b" text-anchor="start" font-weight="600">20%</text>
<text x="740.0" y="108.0" font-size="11" fill="#898781" text-anchor="end" font-weight="400">下界 0.100</text>
<text x="220.0" y="142.0" font-size="11" fill="#52514e" text-anchor="end" font-weight="400">K, A, K, Joker, A → 2×Q</text>
<text x="238.0" y="142.0" font-size="11" fill="#0b0b0b" text-anchor="start" font-weight="600">0%</text>
<text x="740.0" y="142.0" font-size="11" fill="#898781" text-anchor="end" font-weight="400">下界 0.182</text>
<text x="220.0" y="176.0" font-size="11" fill="#52514e" text-anchor="end" font-weight="400">K, K, K, Joker, Joker → 2×Q</text>
<text x="238.0" y="176.0" font-size="11" fill="#0b0b0b" text-anchor="start" font-weight="600">0%</text>
<text x="740.0" y="176.0" font-size="11" fill="#898781" text-anchor="end" font-weight="400">下界 0.294</text>
<text x="220.0" y="210.0" font-size="11" fill="#52514e" text-anchor="end" font-weight="400">A, A, A, A, A → 3×Q</text>
<path d="M232.0,198.0 h428.0 a4,4 0 0 1 4,4 v12.0 a4,4 0 0 1 -4,4 h-428.0 z" fill="#c3c2b7"/>
<text x="672.0" y="210.0" font-size="11" fill="#0b0b0b" text-anchor="start" font-weight="600">100%</text>
<text x="740.0" y="210.0" font-size="11" fill="#898781" text-anchor="end" font-weight="400">下界 0.427</text>
<text x="220.0" y="244.0" font-size="11" fill="#52514e" text-anchor="end" font-weight="400">K, A, K, Joker, A → 3×Q</text>
<path d="M232.0,232.0 h168.8 a4,4 0 0 1 4,4 v12.0 a4,4 0 0 1 -4,4 h-168.8 z" fill="#2a78d6"/>
<text x="412.8" y="244.0" font-size="11" fill="#0b0b0b" text-anchor="start" font-weight="600">40%</text>
<text x="740.0" y="244.0" font-size="11" fill="#0b0b0b" text-anchor="end" font-weight="400">下界 0.573</text>
<text x="220.0" y="278.0" font-size="11" fill="#52514e" text-anchor="end" font-weight="400">Q, Q, Q, Q, Q → 2×Q</text>
<text x="238.0" y="278.0" font-size="11" fill="#0b0b0b" text-anchor="start" font-weight="600">0%</text>
<text x="740.0" y="278.0" font-size="11" fill="#0b0b0b" text-anchor="end" font-weight="400">下界 0.758</text>
<text x="220.0" y="312.0" font-size="11" fill="#52514e" text-anchor="end" font-weight="400">Q, Q, Q, Joker, Joker → 3×Q</text>
<text x="238.0" y="312.0" font-size="11" fill="#0b0b0b" text-anchor="start" font-weight="600">0%</text>
<text x="740.0" y="312.0" font-size="11" fill="#0b0b0b" text-anchor="end" font-weight="400">下界 0.978</text>
<rect x="232" y="347" width="10" height="10" rx="3" fill="#2a78d6"/>
<text x="248.0" y="356.0" font-size="11" fill="#52514e" text-anchor="start" font-weight="400">下界高于门槛：质疑无条件正确</text>
<rect x="482" y="347" width="10" height="10" rx="3" fill="#c3c2b7"/>
<text x="498.0" y="356.0" font-size="11" fill="#52514e" text-anchor="start" font-weight="400">下界低于门槛：不该质疑</text>
</svg>
